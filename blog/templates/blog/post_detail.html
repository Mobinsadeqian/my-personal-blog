{% extends 'blog/base.html' %}

{% block content %}
    <div class="card shadow-lg border-0">
        <div class="card-body p-5">
            <h1 class="display-5 fw-bold text-dark mb-3">{{ post.title }}</h1>
            <div class="text-muted mb-4 border-bottom pb-2">
                <small>📅 تاریخ انتشار: {{ post.created_at|date:"j F Y" }}</small>
            </div>
            
            <div class="card-text fs-5 lh-lg">
                {{ post.body|linebreaks }}
            </div>

            <div class="mt-5 pt-3 border-top">
                <a href="{% url 'post_list' %}" class="btn btn-secondary">
                    🏠 بازگشت به لیست
                </a>
            </div>
        </div>
    </div>
{% endblock %}
